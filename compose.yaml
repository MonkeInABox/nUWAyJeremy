  recorder: # regular recorder for DOT report  
    image: ${IMAGE}:${TAG}
    container_name: recorder
    depends_on: [ "lowlevel", "gps", "nav2"]
    #command: bash -c "cd ../incidentRecord && ros2 bag record -s mcap -a --compression-mode file --compression-format zstd" 
    #command: bash -c "cd ../incidentRecord && ros2 bag record -s mcap /sbg/gps_pos /joy_cmd_vel /odometry/global /candata /lidar_safety/front_left/cloud /lidar_safety/front_right/cloud /lidar_safety/rear_left/cloud /lidar_safety/rear_right/cloud /lidar/localisation_merged/cloud"
    # command: bash -c "cd ../incidentRecord && ros2 bag record -s mcap /sbg/gps_pos"
    command: bash -c "cd ../slamRosbag && ros2 bag record -s mcap /map"
    # record /yolov7/bbox /yolov7/kpt for detections
    network_mode: host
    #expose:
    #    - "8650"
    #network_mode: bridge
    volumes:
    - type: bind
      source: ../incidentRecord
      target: $WORKSPACE/../incidentRecord
    - type: bind
      source: /dev/shm
      target: /dev/shm

  incidentRecorder: # incident recorder snapshot
    image: ${IMAGE}:${TAG}
    container_name: incidentRecorder
    depends_on: [ "lowlevel", "gps", "nav2"]
    command: bash -c "cd ../snapshotTest && ros2 bag record -s mcap --snapshot-mode -a" 
    network_mode: host
    #network_mode: bridge
    volumes:
    - type: bind
      source: ../snapshotTest
      target: $WORKSPACE/../snapshotTest
    - type: bind
      source: /dev/shm
      target: /dev/shm

  controllerBattery: # incident recorder snapshot
    image: ${IMAGE}:${TAG}
    container_name: controllerBattery
    # depends_on: [ ]
    command: ros2 run python_nodes battery_node
    network_mode: host
    privileged: true
    #network_mode: bridge
    volumes:
    - type: bind
      source: /sys/class/power_supply
      target: /sys/class/power_supply
    - type: bind
      source: /dev/shm
      target: /dev/shm

  speechNode: # converts speech to drive commands
    image: ${IMAGE}:${TAG}
    container_name: speechNode
    # depends_on: [ "lowlevel", "gps", "nav2"]
    devices: [ "/dev/snd:/dev/snd" ]
    command: ros2 run python_nodes speech_node 
    network_mode: host
    #network_mode: bridge
    volumes:
    - type: bind
      source: /dev/shm
      target: /dev/shm

  rvizOverlay:
    image: ${IMAGE}:${TAG}
    container_name: rvizOverlay
    network_mode: host
    depends_on: ["rviz", "lowlevel"]
    command: ros2 launch master rvizOverlay.launch.py
    #network_mode: bridge
    volumes:
      - type: bind
        source: /dev/shm
        target: /dev/shm

  stamped_conversion:
    image: ${IMAGE}:${TAG}
    container_name: stamped_conversion
    network_mode: host
    depends_on: ["rviz", "lowlevel", "can_bridge"]
    command: ros2 run python_nodes stamped_conversion
    #network_mode: bridge
    volumes:
      - type: bind
        source: /dev/shm
        target: /dev/shm

