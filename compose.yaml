version: '2'
services:
  lowlevel:
    image: ${IMAGE}:${TAG}
    container_name: lowlevel
    network_mode: host
    #network_mode: bridge
    # devices: [ "dev/ttySBG:/dev/ttySBG" ]
    #devices: [ "dev/ttyUSB0:/dev/ttyUSB0" ]
    build:
      context: .
      # ssh: [ "default=$HOME/.ssh/id_rsa" ]
      target: staging #pull from the current folder
      #target: prod #pull from github
    tty: True        # docker run -t
    stdin_open: True # docker run -i
    #command: ros2 launch master lowlevel.launch.py
    command: ros2 launch master lowlevel.launch.py params_file:=/lowlevel_config
    configs:
      - lowlevel_config
    volumes:
      - type: bind
        source: /dev/shm
        target: /dev/shm
      - type: bind
        source: /dev
        target: /dev
    device_cgroup_rules:
      - 'c 188:* rmw'
      - 'c 189:* rmw'

  rviz:
    #image: ${IMAGE}
    image: ${IMAGE}:${TAG}
    container_name: rviz
    network_mode: host
    #networks: 
    #  - humble_bridge
    #  - host
    privileged: True # to allow forwarding of X11 display for rviz GUI
    environment:
      - DISPLAY
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - type: bind
        source: /dev/shm
        target: /dev/shm
    command: ros2 launch nav2_bringup rviz_launch.py rviz_config:=/rviz_config
    configs:
      - rviz_config

  nav2:
    image: ${IMAGE}:${TAG}
    container_name: nav2
    network_mode: host
    #network_mode: bridge
    depends_on: [ "lowlevel", "rviz" ,"gps"] 
    command: ros2 launch master nav2_launch.py map:=./src/master/maps/${MAP} params_file:=/nav2_config
    # command: ros2 launch master slam_launch.py params_file:=/slam_params
    configs:
      - nav2_config
      - slam_params
    volumes:
      - type: bind
        source: ./mount
        target: $WORKSPACE/mount
      - type: bind
        source: /dev/shm
        target: /dev/shm
      
  gps:
    #image: ${IMAGE}:${WAYPOINT_TAG}
    image: ${IMAGE}:${TAG}
    container_name: gps
    #ports:
    #    - "8650:8650"
    #    - "8651:8651"
    network_mode: host
    #network_mode: bridge
    depends_on: [ "lowlevel", "rviz" ]
    command: ros2 launch master gps_launch.py params_file:=/ekf_config
    #build:
    #  context: .
    #  ssh: [ "default=$HOME/.ssh/id_rsa" ]
    #  target: staging #pull from the current folder
    configs:
      - ekf_config
    volumes:
      - type: bind
        source: /dev/shm
        target: /dev/shm
    #  - type: bind
    #    source: ./mount
    #    target: $WORKSPACE/mount

  # gps_location:
  #   image: ${IMAGE}:${TAG}
