  keepout:
    image: ${IMAGE}:${TAG}
    container_name: keepout
    network_mode: host
    command: ros2 launch master keepout_launch.py mask:=./src/master/maps/keepout_mask.yaml
    volumes:
      - type: bind
        source: /dev/shm
        target: /dev/shm
  

  joy:
    #image: ${IMAGE}
    image: ${IMAGE}:${TAG}
    container_name: joy
    network_mode: host
    #deploy:
    #  replicas: 5
    #  resources:
    #    limits:
    #      cpus: "0.1"
    #      memory: 50M
    #restart_policy:
    #  condition: on-failure
    #ports:
    #  - 3281:3281
    #  - 3668:3668
    #networks: 
    #  - ingress
    #  - host
    # devices: [ "/dev/input/js0:/dev/input/js0" ]
    command: ros2 launch master controller.launch.py
    volumes:
      - type: bind
        source: /dev/shm
        target: /dev/shm
      - type: bind
        source: /dev/input
        target: /dev/input
    device_cgroup_rules:
      - 'c 13:* rmw'

