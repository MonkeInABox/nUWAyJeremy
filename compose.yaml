     container_name: can_bridge
     #expose:
     #   - "8650"
     network_mode: host
     depends_on: [ "joy", "incidentRecorder"]
    #network_mode: bridge
     command: ros2 run python_nodes can_bridge
     volumes:
      - type: bind
        source: /dev/shm
        target: /dev/shm

  all_lidars:
    image: ${IMAGE}:${TAG}
    container_name: all_lidars
    network_mode: host
    #network_mode: bridge
    command: ros2 launch master all_lidars.launch.py
    volumes:
      - type: bind
        source: /dev/shm
        target: /dev/shm

